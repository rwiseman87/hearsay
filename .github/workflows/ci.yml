name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/mac-build-env
        with:
          cache-key: gate

      - run: make ci

      - name: Install the browser
        working-directory: web
        run: npx playwright install chromium

      - run: make e2e

      - name: Upload browser failure reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-failure-reports
          path: |
            outputs/e2e/playwright-report
            outputs/e2e/test-results
          if-no-files-found: ignore
          retention-days: 7
