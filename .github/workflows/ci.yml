name: ci

on:
  push:
    branches: [main]
  pull_request:

# Actions are pinned to full commit SHAs (supply-chain: a moving tag can be repointed at malicious
# code). The trailing comment records the human-readable tag each SHA corresponds to.
jobs:
  # Native gate: Rust + Swift, the codegen-drift check (Rust is the source of truth for the
  # OpenAPI + IPC fixtures), and the supply-chain gates. macOS because the Swift helper + sidecars
  # and the codegen both need the full native toolchain.
  native:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      # cargo-deny (license gate) + cargo-audit (CVE scan) via prebuilt binaries.
      - uses: taiki-e/install-action@43aecc8d72668fbcfe75c31400bc4f890f1c5853 # v2
        with:
          tool: cargo-deny,cargo-audit

      # Web deps are needed by `make codegen-check` (it runs `npm run codegen`).
      - name: Install web deps
        run: cd web && npm ci

      - name: CI gate (lint + tests + codegen drift + audit + licenses)
        run: make ci

  # Frontend gate: install, type-check, build the React bundle.
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Web CI (install, typecheck, build)
        run: make web-ci
