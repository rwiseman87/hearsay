name: promote

# Publishes an installer ci.yml already built. Nothing is rebuilt and nothing is re-stamped: the DMG
# attached to the release is byte-for-byte the artifact that run produced, and it carries the version
# the tag is cut at. The release is a draft, so the notes and the artifact get a look first.
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: ci run to promote (blank = the newest successful run on main)
        type: string
        required: false

permissions:
  contents: read

jobs:
  promote:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history and tags: the changelog spans the previous release.
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve the build to promote
        id: build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          set -euo pipefail
          run_id="$RUN_ID"
          if [ -z "$run_id" ]; then
            run_id="$(gh run list --workflow ci.yml --branch main --status success \
              --limit 1 --json databaseId --jq '.[0].databaseId')"
            test -n "$run_id" || { echo "::error::no successful ci run on main to promote"; exit 1; }
          fi
          sha="$(gh run view "$run_id" --json headSha --jq .headSha)"
          # A release must come off main, not a branch someone dispatched ci on.
          if ! git merge-base --is-ancestor "$sha" HEAD; then
            echo "::error::run $run_id built $sha, which is not on main"
            exit 1
          fi
          echo "promoting run $run_id ($sha)"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Download the installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ steps.build.outputs.run_id }}
        run: gh run download "$RUN_ID" --name hearsay-macos-dmg --dir dist

      - name: Verify the artifact and read its version
        id: artifact
        run: |
          set -euo pipefail
          dmg="$(find dist -maxdepth 2 -name 'Hearsay_*_aarch64.dmg' | head -1)"
          test -n "$dmg" || { echo "::error::no DMG in the artifact"; exit 1; }
          dir="$(dirname "$dmg")"
          base="$(basename "$dmg")"
          ( cd "$dir" && sha256sum -c "$base.sha256" )
          version="${base#Hearsay_}"
          version="${version%_aarch64.dmg}"
          echo "$base verified"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Draft, not published: a human reviews the notes and the artifact before anyone can download
      # it. The static half of the notes lives in .github/release-notes-macos.md.
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ steps.build.outputs.sha }}
          DIR: ${{ steps.artifact.outputs.dir }}
          BASE: ${{ steps.artifact.outputs.base }}
          VERSION: ${{ steps.artifact.outputs.version }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "::error::a release for $tag already exists"
            exit 1
          fi
          # The previous release, read before the new tag is claimed below.
          prev="$(git tag --list 'v*' --sort=-v:refname | head -1)"
          # The tag is created here rather than left to the release: a draft release does not create
          # its tag until it is published, and the next installer build reads the tags to pick a
          # version. Claiming it now keeps that monotonic even while the draft sits unpublished.
          existing="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq .object.sha 2>/dev/null || true)"
          if [ -z "$existing" ]; then
            gh api "repos/$GITHUB_REPOSITORY/git/refs" \
              -f "ref=refs/tags/$tag" -f "sha=$SHA" --silent
          elif [ "$existing" != "$SHA" ]; then
            echo "::error::$tag already exists at $existing, not $SHA"
            exit 1
          fi
          notes="$RUNNER_TEMP/notes.md"
          {
            printf 'Hearsay %s -- local-first meeting transcriber for macOS.\n\n' "$VERSION"
            printf 'Requires an Apple Silicon Mac on macOS 14.4 or later.\n'
            cat .github/release-notes-macos.md
            printf '\n## Checksum\n\n```\n%s\n```\n' "$(cat "$DIR/$BASE.sha256")"
            if [ -n "$prev" ]; then
              printf '\n## Changes since %s\n\n' "$prev"
              git log --pretty='- %s' "$prev..$SHA"
            fi
          } > "$notes"
          cat "$notes"
          gh release create "$tag" \
            --draft \
            --title "Hearsay $VERSION" \
            --notes-file "$notes" \
            "$DIR/$BASE" "$DIR/$BASE.sha256"
