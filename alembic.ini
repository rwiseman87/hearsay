# Alembic configuration. The database URL is supplied at runtime by env.py from
# hearsay.config.Settings (or an override passed via the API), so it is not set
# here. Migrations live under src/hearsay/db/migrations (forward-only).
[alembic]
script_location = src/hearsay/db/migrations
prepend_sys_path = src
path_separator = os
