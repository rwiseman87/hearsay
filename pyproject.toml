[project]
name = "hearsay"
version = "0.1.0"
description = "Local-first macOS meeting-note transcriber"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "click>=8.1",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "alembic>=1.13",
]

[project.optional-dependencies]
# ASR (Parakeet) + diarization (pyannote community-1) + voiceprints all run in the Swift
# helpers on the ANE -- no Python ML dep. This extra is just Silero VAD (onnxruntime) + numpy
# for packing PCM for the sidecars. (Both are removed once Me moves to a Swift sidecar too.)
asr = ["onnxruntime>=1.27", "numpy>=2.2"]
bedrock = ["boto3>=1.35"]

[project.scripts]
hearsay = "hearsay.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hearsay"]

[dependency-groups]
dev = [
    "mypy>=1.11",
    "ruff>=0.6",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "pip-audit>=2.7",
    "pip-licenses>=5.5.5",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
# Alembic-generated migrations follow Alembic's own style, not ours.
extend-exclude = ["src/hearsay/db/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "PL", "RUF"]
ignore = ["PLR2004"]

[tool.ruff.lint.pylint]
max-args = 8

[tool.mypy]
python_version = "3.14"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
warn_unused_ignores = true
# Alembic's op/context are dynamically typed; migration scripts are generated.
exclude = ["src/hearsay/db/migrations/"]

[[tool.mypy.overrides]]
module = [
    "onnxruntime.*",
    "silero_vad.*",
    "numpy.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
