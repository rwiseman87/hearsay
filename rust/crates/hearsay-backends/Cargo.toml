[package]
name = "hearsay-backends"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
hearsay-engine = { path = "../hearsay-engine" }
hearsay-orchestrator = { path = "../hearsay-orchestrator" }
hearsay-capture = { path = "../hearsay-capture" }
hearsay-inference = { path = "../hearsay-inference" }
hearsay-notes-prompt = { path = "../hearsay-notes-prompt" }
hearsay-db = { path = "../hearsay-db" }
hearsay-audio = { path = "../hearsay-audio" }
tokio = { workspace = true, features = ["rt", "sync", "time"] }
async-trait = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }

[features]
aec = ["hearsay-orchestrator/aec"]
# The model-free scripted engine for the browser E2E and dev runs; release builds leave it out.
scripted = []

[dev-dependencies]
# Enables `scripted` for this crate's own tests.
hearsay-backends = { path = ".", features = ["scripted"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tempfile = { workspace = true }
hound = { workspace = true }
