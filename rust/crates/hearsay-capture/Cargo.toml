[package]
name = "hearsay-capture"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
hearsay-orchestrator = { path = "../hearsay-orchestrator" }
hearsay-ipc = { path = "../hearsay-ipc" }
tokio = { workspace = true, features = ["net", "process", "io-util", "sync", "time", "rt", "macros"] }
async-trait = { workspace = true }
tempfile = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
