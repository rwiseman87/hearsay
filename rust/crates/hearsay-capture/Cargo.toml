[package]
name = "hearsay-capture"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
hearsay-orchestrator = { path = "../hearsay-orchestrator" }
hearsay-ipc = { path = "../hearsay-ipc" }
tokio = { version = "1.52.3", features = ["net", "process", "io-util", "sync", "time", "rt", "macros"] }
async-trait = "0.1.89"
tempfile = "3.27.0"
tracing = "0.1.44"

# Windows capture (`WasapiSource`): WASAPI shared-mode capture + process/device loopback. Target-
# gated so macOS never compiles it; still lockfile-resolved everywhere, so `make licenses` /
# `make audit` vet it from any host.
[target.'cfg(windows)'.dependencies]
wasapi = "0.23.0"

[dev-dependencies]
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread"] }
