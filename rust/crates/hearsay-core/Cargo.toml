[package]
name = "hearsay-core"
version.workspace = true
edition.workspace = true

[dependencies]
hearsay-db = { path = "../hearsay-db" }
hearsay-engine = { path = "../hearsay-engine" }
hearsay-orchestrator = { path = "../hearsay-orchestrator" }
hearsay-capture = { path = "../hearsay-capture" }
axum = { version = "0.8.9", features = ["ws", "macros"] }
tower-http = { version = "0.7.0", features = ["fs"] }
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread", "net", "signal", "fs", "sync", "time"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["json", "env-filter", "fmt"] }
utoipa = { version = "5.5.0", features = ["axum_extras", "uuid", "chrono"] }
uuid = { version = "1.23.4", features = ["v4", "serde"] }
chrono = { version = "0.4.45", features = ["serde"] }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "uuid", "chrono"] }
async-trait = "0.1.89"
tower = { version = "0.5.3", features = ["util"] }

[dev-dependencies]
tempfile = "3.27.0"
