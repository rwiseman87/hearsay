[package]
name = "hearsay-core"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
hearsay-db = { path = "../hearsay-db" }
hearsay-engine = { path = "../hearsay-engine" }
hearsay-backends = { path = "../hearsay-backends" }
hearsay-ipc = { path = "../hearsay-ipc" }
hearsay-audio = { path = "../hearsay-audio" }
axum = { version = "0.8.9", features = ["ws", "macros"] }
tower-http = { version = "0.7.0", features = ["fs", "set-header", "trace", "request-id"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "signal", "fs", "sync", "time", "io-std", "io-util"] }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3.23", features = ["json", "env-filter", "fmt"] }
utoipa = { version = "5.5.0", features = ["axum_extras", "uuid", "chrono"] }
# Browsable API console at /docs (the `api-console` feature; see `create_app`).
# `default-features = false` + `vendored` is required, not cosmetic: the default build script shells
# out to `curl` to fetch the Swagger UI assets at build time, which the offline/pinned dependency
# policy rules out. The vendored crate carries the assets instead, so the build never touches the
# network.
utoipa-swagger-ui = { version = "9.0.2", default-features = false, features = ["axum", "vendored"], optional = true }
uuid = { workspace = true, features = ["v4", "serde"] }
chrono = { workspace = true, features = ["serde"] }
sqlx = { workspace = true }
tower = { version = "0.5.3", features = ["util"] }
# Notes-model download manager. ureq: blocking HTTPS with bundled rustls + webpki roots (no OS cert
# dep, no async runtime pulled in — runs in spawn_blocking).
ureq = "3.3.0"
sha2 = "0.10.9"

[features]
# The browsable Swagger UI console at /docs, for working against the API by hand. Off by default:
# `vendored` embeds ~1.6 MB of JS/CSS into the binary at COMPILE time, so a runtime check alone
# would still ship the assets. `make rust-serve` turns it on; the packaged app does not. The mount
# additionally requires ENVIRONMENT=development at runtime, so a feature-enabled build cannot expose
# the console in a shipping configuration either.
api-console = ["dep:utoipa-swagger-ui"]
aec = ["hearsay-backends/aec"]

[dev-dependencies]
tempfile = { workspace = true }
# Real WebSocket client for the handshake-gating + full-stack integration tests (axum's
# WebSocketUpgrade extractor cannot be driven by tower::oneshot). Already in the lock.
tokio-tungstenite = "0.29.0"
futures-util = "0.3.32"
# The scripted Orchestrator fakes (pub mod testing) for the full-stack test's model-free engine.
hearsay-orchestrator = { path = "../hearsay-orchestrator" }
# Voiceprint byte encoding, so the voiceprint tests seed centroids the way the refine really does
# rather than hand-rolling the little-endian f32 layout.
hearsay-attribution = { path = "../hearsay-attribution" }
