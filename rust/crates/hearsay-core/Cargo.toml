[package]
name = "hearsay-core"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
hearsay-db = { path = "../hearsay-db" }
hearsay-engine = { path = "../hearsay-engine" }
hearsay-backends = { path = "../hearsay-backends" }
hearsay-ipc = { path = "../hearsay-ipc" }
axum = { version = "0.8.9", features = ["ws", "macros"] }
tower-http = { version = "0.7.0", features = ["fs", "set-header", "trace", "request-id"] }
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread", "net", "signal", "fs", "sync", "time", "io-std", "io-util"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["json", "env-filter", "fmt"] }
utoipa = { version = "5.5.0", features = ["axum_extras", "uuid", "chrono"] }
uuid = { version = "1.23.4", features = ["v4", "serde"] }
chrono = { version = "0.4.45", features = ["serde"] }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "uuid", "chrono"] }
tower = { version = "0.5.3", features = ["util"] }
# Notes-model download manager (always compiled — independent of the `notes` inference feature so the
# `/api/models` surface + codegen stay identical across feature states). ureq: blocking HTTPS with a
# bundled rustls + webpki roots (no OS cert dep, no async runtime pulled in — runs in spawn_blocking).
ureq = "3.3.0"
sha2 = "0.10.9"

# GPU backends for the offline whisper refine, forwarded through `hearsay-backends` to
# `hearsay-inference`'s whisper-rs. Off by default (CPU); the macOS bundle + `rust-serve` build with
# `metal` (see the Makefile) — a large win on Apple Silicon. vulkan/cuda are here for the planned
# cross-platform builds; enable one per target (building a backend the host lacks fails).
[features]
# The cross-platform (Windows) sherpa-onnx live/diarize path; required by the Windows backend
# (`--features sherpa` there), off by default so the macOS bundle never links onnxruntime. The local
# notes LLM is no longer a feature of the core: it runs out-of-process in the `hearsay-notes` sidecar
# (built separately with its own `metal`/`vulkan` accel), so llama.cpp never links here with whisper.
sherpa = ["hearsay-backends/sherpa"]
aec = ["hearsay-backends/aec"]
metal = ["hearsay-backends/metal"]
vulkan = ["hearsay-backends/vulkan"]
cuda = ["hearsay-backends/cuda"]

[dev-dependencies]
tempfile = "3.27.0"
# Real WebSocket client for the handshake-gating + full-stack integration tests (axum's
# WebSocketUpgrade extractor cannot be driven by tower::oneshot). Already in the lock.
tokio-tungstenite = "0.29.0"
futures-util = "0.3.32"
# The scripted Orchestrator fakes (pub mod testing) for the full-stack test's model-free engine.
hearsay-orchestrator = { path = "../hearsay-orchestrator" }
