[package]
name = "hearsay-db"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
hearsay-attribution = { path = "../hearsay-attribution" }
chrono = "0.4.45"
serde_json = "1.0.150"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "uuid", "chrono", "macros", "migrate"] }
uuid = { version = "1.23.4", features = ["v4"] }

[dev-dependencies]
hearsay-attribution = { path = "../hearsay-attribution" }
tokio = { version = "1.52.3", features = ["macros", "rt"] }
