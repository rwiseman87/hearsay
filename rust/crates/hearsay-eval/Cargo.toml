[package]
name = "hearsay-eval"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
hearsay-attribution = { path = "../hearsay-attribution" }
hearsay-inference = { path = "../hearsay-inference" }
serde = { workspace = true }
serde_json = { workspace = true }

[features]
# Build the real Speex canceller into the echo eval (`make aec-eval`).
aec = ["hearsay-orchestrator/aec"]

[dev-dependencies]
hearsay-audio = { path = "../hearsay-audio" }
hearsay-db = { path = "../hearsay-db" }
hearsay-engine = { path = "../hearsay-engine" }
hearsay-orchestrator = { path = "../hearsay-orchestrator" }
hound = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
