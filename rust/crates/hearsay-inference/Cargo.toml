[package]
name = "hearsay-inference"
version.workspace = true
edition.workspace = true

[dependencies]
hound = "3.5.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sherpa-onnx = "1.13.3"
tempfile = "3.27.0"
whisper-rs = "0.16.0"

# Per-OS GPU acceleration is opt-in (default = portable CPU). The installer/build selects the
# backend for the target: `--features metal` on macOS, `vulkan` on the Intel Arc iGPU, `cuda` on
# discrete NVIDIA. Same code, per-OS accel (see docs/architecture-cross-platform.md).
[features]
metal = ["whisper-rs/metal"]
vulkan = ["whisper-rs/vulkan"]
cuda = ["whisper-rs/cuda"]
