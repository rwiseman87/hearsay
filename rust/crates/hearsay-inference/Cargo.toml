[package]
name = "hearsay-inference"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
hearsay-attribution = { path = "../hearsay-attribution" }
hound = "3.5.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
# `shared` (not the crate's default `static`) links sherpa-onnx + onnxruntime as DLLs. The static
# libs are prebuilt against the *static* CRT, which would force `-C target-feature=+crt-static` on
# the whole binary — and whisper.cpp pins CMP0091 OLD, so its cmake appends `/MD` after the `/MT`
# and the link fails on mismatched runtimes with no toolchain-file fix available. Linking the DLLs
# keeps the CRT inside them, so every crate here builds against the default dynamic runtime.
sherpa-onnx = { version = "1.13.3", optional = true, default-features = false, features = [
    "shared",
] }
tempfile = "3.27.0"
whisper-rs = "0.16.0"
# The optional `notes` local-LLM summarization path (llama.cpp via llama-cpp-2, the sibling of the
# whisper-rs embed). Off by default so a build without notes never compiles or links llama.cpp;
# `encoding_rs` is only needed for its streaming token decoder.
llama-cpp-2 = { version = "0.1.151", default-features = false, optional = true }
encoding_rs = { version = "0.8.35", optional = true }

# `sherpa` enables the cross-platform (Windows) sherpa-onnx diarize + streaming path; it is off by
# default so the macOS bundle never compiles or links onnxruntime (macOS uses the Swift sidecars).
#
# Per-OS GPU acceleration for the whisper refine is opt-in (default = portable CPU). The
# installer/build selects the backend for the target: `--features metal` on macOS, `vulkan` on the
# Intel Arc iGPU, `cuda` on discrete NVIDIA. Same code, per-OS accel (see docs/architecture.md).
[features]
sherpa = ["dep:sherpa-onnx"]
notes = ["dep:llama-cpp-2", "dep:encoding_rs"]
# GPU accel forwards to whisper-rs and, when `notes` is on, to llama-cpp-2 too (weak-dep `?/`), so a
# single `--features metal,notes` build accelerates both on the same backend.
metal = ["whisper-rs/metal", "llama-cpp-2?/metal"]
vulkan = ["whisper-rs/vulkan", "llama-cpp-2?/vulkan"]
cuda = ["whisper-rs/cuda", "llama-cpp-2?/cuda"]
