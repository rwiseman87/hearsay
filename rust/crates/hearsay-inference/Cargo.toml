[package]
name = "hearsay-inference"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
hearsay-attribution = { path = "../hearsay-attribution" }
hearsay-audio = { path = "../hearsay-audio" }
hound = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
whisper-rs = "0.16.0"

# GPU acceleration for the whisper refine is opt-in (default = portable CPU); the macOS build
# enables `metal`. The notes LLM's matching GPU accel lives on the standalone `hearsay-notes`
# crate (separate process, so llama.cpp's ggml never co-links with whisper.cpp's).
[features]
metal = ["whisper-rs/metal"]
