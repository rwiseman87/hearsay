[package]
name = "hearsay-orchestrator"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
hearsay-engine = { path = "../hearsay-engine" }
hearsay-db = { path = "../hearsay-db" }
tokio = { workspace = true, features = ["process", "io-util", "sync", "rt", "time", "macros", "fs"] }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true, features = ["v4"] }
chrono = { workspace = true }
tracing = { workspace = true }
sqlx = { workspace = true }
hound = { workspace = true }
# Acoustic echo cancellation (SpeexDSP via aec-rs, MIT; vendored SpeexDSP is BSD-3-Clause). Optional:
# gated by the `aec` feature so the default `cargo test` build needs no C toolchain. Builds the
# vendored SpeexDSP with cc + cmake + bindgen. See docs/echo-cancellation.md.
aec-rs = { version = "1.0.0", optional = true }

[features]
# Echo-cancel the Me stream against the Them tap in `demux`. Enabled in `make rust-serve` and
# `make mac-app`/`make dmg`; off by default. The alignment logic is tested without the feature.
aec = ["dep:aec-rs"]

[dev-dependencies]
insta = "1.48.0"
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
