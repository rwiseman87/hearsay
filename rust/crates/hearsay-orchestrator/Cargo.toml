[package]
name = "hearsay-orchestrator"
version.workspace = true
edition.workspace = true

[dependencies]
hearsay-engine = { path = "../hearsay-engine" }
hearsay-db = { path = "../hearsay-db" }
tokio = { version = "1.52.3", features = ["process", "io-util", "sync", "rt", "time"] }
async-trait = "0.1.89"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
uuid = { version = "1.23.4", features = ["v4"] }
chrono = "0.4.45"
tracing = "0.1.44"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "uuid", "chrono"] }
hound = "3.5.1"

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread"] }
