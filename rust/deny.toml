# cargo-deny license policy (https://embarkstudios.github.io/cargo-deny/). Encodes the CLAUDE.md
# open-license gate: only permissive licenses are allowed (MIT / BSD / Apache-2.0 and equivalents);
# strong-copyleft families (GPL / AGPL / LGPL / EUPL / SSPL / CC-BY-SA) are denied by omission
# (`version = 2` treats any unlisted license as a failure). Checked by `make licenses` over both the
# rust/ workspace and the web/src-tauri Tauri shell.
#
# MPL-2.0 is the one deliberate exception to "permissive only": it is weak, file-level copyleft that
# reaches only the specific MPL-licensed files, so redistributing those files unmodified as a
# dependency imposes no obligation on our own code. It is pulled in transitively by the Tauri tree
# and cannot be removed. If an unlisted *permissive* license appears, add its SPDX id here; never add
# a strong-copyleft id (GPL / AGPL / LGPL / SSPL / EUPL).
#
# First-party crates (hearsay-*, hearsay-app) are `publish = false` and skipped via `private.ignore`
# below rather than carrying a per-crate SPDX license: the project is licensed as a whole at the repo
# root under the Apache License 2.0 with the Commons Clause (source-available, not an OSS license), so
# this gate deliberately covers third-party dependencies only.

[graph]
# Resolve the dependency graph with ALL features enabled so optional-feature deps
# (notes/llama-cpp-2, metal) are license-checked too. The
# default (default-features-only) graph prunes them, so a future copyleft optional dep would slip
# past CI. Verified all-features stays fully permissive (2026-07-17).
all-features = true

[licenses]
version = 2
confidence-threshold = 0.9
# One `allow` list serves both the rust/ workspace and the web/src-tauri tree, which have different
# dependency sets, so some permissive ids are used by only one tree (e.g. MPL-2.0 is tauri-only). Keep
# the superset without the per-tree `license-not-encountered` noise; an actually-denied (copyleft)
# license still fails, since unlisted licenses are rejected by `version = 2`.
unused-allowed-license = "allow"
# Skip our own unpublished workspace crates (publish = false); they carry no license on purpose.
private = { ignore = true }
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "BSL-1.0",
    "CDLA-Permissive-2.0", # webpki-roots (Mozilla CA bundle) — permissive data license
    "Unlicense",           # whisper-rs / whisper-rs-sys — public-domain dedication
    "MPL-2.0",             # Tauri tree (see note above) — weak file-level copyleft, allowed
]
