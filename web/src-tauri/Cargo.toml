[package]
name = "hearsay-app"
version = "0.1.0"
edition = "2021"
description = "Hearsay desktop shell (Tauri)"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"

[target.'cfg(unix)'.dependencies]
# SIGTERM the core for a graceful shutdown before the SIGKILL backstop (see stop_core_gracefully).
libc = "0.2.186"

# Standalone from the `rust/` workspace: this crate only bundles + spawns the built binaries.
[workspace]
